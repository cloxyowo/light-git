name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact_name: lgit.exe
            output_name: lgit.exe
          - os: ubuntu-latest
            arch: x64
            artifact_name: lgit-linux-x64
            output_name: lgit
          - os: macos-13
            arch: x64
            artifact_name: lgit-macos-x64
            output_name: lgit
          - os: macos-14
            arch: arm64
            artifact_name: lgit-macos-arm64
            output_name: lgit

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Artifact (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Copy-Item build/Release/lgit.exe ./lgit.exe

    - name: Prepare Artifact (Unix)
      if: runner.os != 'Windows'
      run: |
        cp build/lgit ./${{ matrix.artifact_name }}
        chmod +x ./${{ matrix.artifact_name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release Assets
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all built artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets
        merge-multiple: true

    - name: Copy installer scripts into release assets
      run: |
        cp scripts/install.ps1 release_assets/
        cp scripts/install.sh release_assets/

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_assets/*
        generate_release_notes: true
