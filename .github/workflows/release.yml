name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: lgit-windows-x64
          - os: ubuntu-latest
            artifact_name: lgit-linux-x64
          - os: macos-latest
            artifact_name: lgit-macos

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
        else
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Copy-Item build/Release/lgit.exe ./lgit.exe

    - name: Prepare Artifacts (Linux)
      if: runner.os == 'Linux'
      run: |
        cp build/lgit ./lgit-linux-x64
        chmod +x ./lgit-linux-x64

    - name: Prepare Artifacts (macOS Universal & Thin)
      if: runner.os == 'macOS'
      run: |
        cp build/lgit ./lgit-macos
        cp build/lgit ./lgit-macos-universal
        lipo -thin arm64 build/lgit -output ./lgit-macos-arm64
        lipo -thin x86_64 build/lgit -output ./lgit-macos-x64
        chmod +x ./lgit-macos*
        file ./lgit-macos*

    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: lgit.exe

    - name: Upload Linux Artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: lgit-linux-x64

    - name: Upload macOS Artifacts
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          lgit-macos
          lgit-macos-universal
          lgit-macos-arm64
          lgit-macos-x64

  publish-release:
    name: Publish Release Assets
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Determine tag name
      id: vars
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download all built artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets
        merge-multiple: true

    - name: Copy installer scripts into release assets
      run: |
        cp scripts/install.ps1 release_assets/
        cp scripts/install.sh release_assets/
        ls -la release_assets/

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.vars.outputs.tag }}
        files: release_assets/*
        generate_release_notes: true
